[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medstyleaudit"
version = "0.1.0"
description = "Pixel-identical ROI counterfactual audits for Camelyon17-WILDS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "scipy>=1.10",
  "scikit-image>=0.21",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
train = ["torch>=2.1", "torchvision>=0.16", "wilds>=2.0"]
hf = ["datasets>=3.0", "pyarrow>=15", "huggingface-hub>=0.24"]
wsi = ["openslide-python>=1.3"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
