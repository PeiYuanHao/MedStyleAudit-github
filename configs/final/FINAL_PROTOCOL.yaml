protocol_version: 1.0.0
status: frozen
paper_title: Auditing Hospital-Associated Context Sensitivity with a Pixel-Identical Label-Defining Region
scientific_definitions:
  patch_size: 96
  roi_size: 32
  roi_location: central
  roi_preservation: exact_pixel_identity
  hcs: excess_absolute_normalized_logit_instability_cross_minus_within
  hce: signed_normalized_logit_shift_cross_minus_within
  global_summaries: [common_support, pair_weighted]
  interpretation: sensitivity_contrast_not_causal_scanner_stain_identification
matching:
  method: balanced_matched_triplets
  donors_per_source: 3
  lambda_balance: 2.0
  lambda_pair: 0.25
  tau_distance: 6.0
  tau_balance: 1.0
  candidate_pool_size: 64
  donor_reuse_cap: 20
  descriptor_features: [tissue_fraction, component_count, area_mean, area_std, area_max, normalized_perimeter, compactness, eccentricity, centroid_x, centroid_y, grid_0, grid_1, grid_2, grid_3, grid_4, grid_5, grid_6, grid_7, grid_8, empty_mask]
  exact_columns: [label]
  classifier_outcome_tuning: prohibited
models:
  backbones: [resnet50, densenet121]
  initialization: random
  pretrained_weights: prohibited
  seeds: [11, 23, 42, 57, 71, 89, 101, 131, 173, 211]
  loss: BCEWithLogitsLoss
  optimizer: AdamW
  learning_rate: 0.0003
  weight_decay: 0.0001
  scheduler: cosine
  selection: validation
  epochs: 20
  batch_size: 128
audit:
  validation_source_hospital: 1
  final_test_source_hospital: 2
  held_out_within_donors: same_held_out_hospital
  held_out_cross_donor_bank: [0, 3, 4]
  expected_directed_pairs:
    val: [[1, 0], [1, 3], [1, 4]]
    test: [[2, 0], [2, 3], [2, 4]]
  bootstrap_draws: 2000
  confidence: 0.95
controls:
  roi_only: required
  planted_shortcut:
    required: true
    rho: [0.0, 0.25, 0.5, 0.75, 1.0]
    cue_location: outside_protected_roi
  context_randomized:
    required: true
    assignment: independent_realistic_peripheral_context
    donor_label_equals_source_label: false
robustness:
  source_buffer:
    values: [0, 4, 8, 16]
    rematching: prohibited
  seam: [hard, primary_feathered]
  lesion_aware: conditional_on_validated_alignment
identification_ladder:
  required: [naive_cross, random_paired, independent_nearest_neighbor, balanced_matched_triplets]
  lesion_aware: conditional
  appearance_matched: optional_secondary
optional_secondary: [appearance_matched_ladder, GroupDRO, HED_augmentation, context_consistency_mitigation, second_external_medical_dataset]
final_test:
  source_hospital: 2
  requires: [protocol_hash, clean_git_commit, final_preflight_PASS, allow_final_test_flag]
  protocol_overrides_after_open: prohibited
