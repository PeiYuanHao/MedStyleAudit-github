experiment: final_suite
protocol_path: configs/final/FINAL_PROTOCOL.yaml
seeds: [11, 23, 42, 57, 71, 89, 101, 131, 173, 211]
backbones:
  resnet50: configs/models/resnet50_hf.yaml
  densenet121: configs/models/densenet121_hf.yaml
artifact_repository: ${MEDSTYLE_HF_REPO}
preflight:
  repository: .
  protocol_path: configs/final/FINAL_PROTOCOL.yaml
  protocol_hash_path: ${MEDSTYLE_OUTPUT_ROOT}/protocol/protocol_sha256.txt
  pytest_marker: ${MEDSTYLE_OUTPUT_ROOT}/protocol/pytest_passed.json
  required_dataset_files:
    - ${MEDSTYLE_DATA_ROOT}/huggingface/Camelyon17-WILDS
  descriptor_features: [tissue_fraction, component_count, area_mean, area_std, area_max, normalized_perimeter, compactness, eccentricity, centroid_x, centroid_y, grid_0, grid_1, grid_2, grid_3, grid_4, grid_5, grid_6, grid_7, grid_8, empty_mask]
  donor_reuse_cap: 20
  expected_hospital_pairs:
    - [train, 0, 3]
    - [train, 0, 4]
    - [train, 3, 0]
    - [train, 3, 4]
    - [train, 4, 0]
    - [train, 4, 3]
    - [id_val, 0, 3]
    - [id_val, 0, 4]
    - [id_val, 3, 0]
    - [id_val, 3, 4]
    - [id_val, 4, 0]
    - [id_val, 4, 3]
    - [val, 1, 0]
    - [val, 1, 3]
    - [val, 1, 4]
  thresholds:
    directed_coverage: 0.90
    common_support_coverage: 0.90
    aggregate_abs_paired_smd: 0.10
    per_feature_abs_smd: 0.10
  required_matching_files: [descriptors, directed_coverage, common_support_coverage, matching_balance, feature_balance, donor_reuse, slide_reuse, source_ledger, integrity_report]
  files:
    integrity_report: ${MEDSTYLE_OUTPUT_ROOT}/p0/data_integrity/integrity_report.json
    alignment_report: ${MEDSTYLE_OUTPUT_ROOT}/p0/data_integrity/alignment_report.json
    descriptors: ${MEDSTYLE_OUTPUT_ROOT}/p0/descriptors/descriptors.parquet
    source_ledger: ${MEDSTYLE_OUTPUT_ROOT}/p0/matching/source_ledger.parquet
    directed_coverage: ${MEDSTYLE_OUTPUT_ROOT}/p0/matching/directed_coverage.csv
    common_support_coverage: ${MEDSTYLE_OUTPUT_ROOT}/p0/matching/common_support_coverage.csv
    matching_balance: ${MEDSTYLE_OUTPUT_ROOT}/p0/matching/matching_balance.csv
    feature_balance: ${MEDSTYLE_OUTPUT_ROOT}/p0/matching/feature_balance.csv
    donor_reuse: ${MEDSTYLE_OUTPUT_ROOT}/p0/matching/donor_reuse.csv
    slide_reuse: ${MEDSTYLE_OUTPUT_ROOT}/p0/matching/slide_reuse.csv
