experiment: primary_audit
seed: 42
output_dir: ${MEDSTYLE_OUTPUT_ROOT}/primary_audit
data:
  triplets: ${MEDSTYLE_OUTPUT_ROOT}/p0/matching/triplets.parquet
  id_validation_logits: ${MEDSTYLE_OUTPUT_ROOT}/predictions/resnet50/seed_0011/id_val.parquet
audit:
  split: val
  roi_size: 32
  patch_size: 96
  source_buffer: 0
  feather_width: 4
  inference_batch_size: 64
  q_min: 0.001
  bootstrap_draws: 2000
  confidence: 0.95
  audit_sample_size: 10000
  audit_sampling_seed: 2026
  pair_weights: equal
  expected_directed_pairs:
    val: [[1, 0], [1, 3], [1, 4]]
    test: [[2, 0], [2, 3], [2, 4]]
